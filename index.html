// Função para pegar questões OMBEP por nível e embaralhar
function getOMBEPQuestions(level, count) {
  var pool = [];
  var keys = Object.keys(OMBEP);
  for(var i=0; i<keys.length; i++){
    var cat = keys[i];
    if(level==='bronze' && cat.indexOf('bronze')>=0) pool=pool.concat(OMBEP[cat]);
    else if(level==='prata' && (cat.indexOf('prata')>=0||cat.indexOf('bronze')>=0)) pool=pool.concat(OMBEP[cat]);
    else if(level==='ouro') pool=pool.concat(OMBEP[cat]);
    else if(level==='boss') pool=pool.concat(OMBEP[cat]);
  }
  return shuf(pool).slice(0, count||10);
}

/* ═══════════════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════════════ */
function xpFor(l){ return Math.floor(100*Math.pow(1.45,l-1)); }
function pk(w,p){ return 'w'+w+'_p'+p; }
function rnd(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function shuf(arr){ return arr.slice().sort(function(){return Math.random()-.5;}); }
function pet(id){ return PETS.find(function(p){return p.id===id;})||PETS[0]; }
function getPet(){ return pet(P().pActive); }
function getRank(){
  var tot = P().xp;
  var r = RANKS[0];
  for(var i=0;i<RANKS.length;i++){ if(tot>=RANKS[i].min) r=RANKS[i]; }
  return r;
}
function badgeClass(rarity){
  var m={common:'b-common',uncommon:'b-uncommon',rare:'b-rare',epic:'b-epic',legendary:'b-legendary',mythic:'b-mythic'};
  return m[rarity]||'b-common';
}
function phaseUnlocked(w,p){
  if(w===0&&p===0) return true;
  if(p>0) return !!P().phases[pk(w,p-1)];
  if(w>0) return !!P().phases[pk(w-1,WORLDS[w-1].phases.length-1)];
  return false;
}
function worldUnlocked(w){ return w===0||!!P().phases[pk(w-1,WORLDS[w-1].phases.length-1)]; }

function addXP(n){
  var pr=P();
  pr.xp+=n;
  var leveled=false;
  while(pr.xp>=pr.xpNext){
    pr.xp-=pr.xpNext;
    pr.level++;
    pr.xpNext=xpFor(pr.level);
    leveled=true;
    onLevelUp(pr.level);
  }
  if(leveled){ unlockAch('level_5'); unlockAch('level_10'); unlockAch('level_20'); }
  updTopbar();
  saveAll();
}

  showModal(

    '<button class="btn btn-p btn-full btn-lg" onclick="closeModal()">Incrível! 🎉</button>'
  );

}

function unlockAch(id){
  var pr=P();if(!pr)return;
  if(pr.achs.indexOf(id)>=0)return;
  var a=ACHS.find(function(a){return a.id===id;});
  if(!a)return;
  // Check level
  if(id==='level_5'&&pr.level<5)return;
  if(id==='level_10'&&pr.level<10)return;
  if(id==='level_20'&&pr.level<20)return;
  if(id==='collector_3'&&pr.pOwned.length<3)return;
  if(id==='collector_10'&&pr.pOwned.length<10)return;
  if(id==='collector_all'&&pr.pOwned.length<PETS.length)return;
  pr.achs.push(id);
  pr.coins+=a.rw;
  saveAll();
  setTimeout(function(){
    showModal(
      '<div style="font-size:.8rem;color:var(--gold);font-weight:700;margin-bottom:6px">CONQUISTA DESBLOQUEADA!</div>'+
      '<div style="font-size:3rem;margin-bottom:8px">'+a.icon+'</div>'+

      '<button class="btn btn-p btn-full" onclick="closeModal()">Receber 🎁</button>'
    );
  },300);
}

  G.profiles=G.profiles.filter(function(p){return p.id!==id;});
  saveAll();
  if(G.curProfile&&G.curProfile.id===id){
    G.curProfile=null;
    showScreen('profiles');

  } else { renderProfiles(); }

function chkStreak(){
  var pr=P();if(!pr)return;
  var today=new Date().toDateString();
  if(pr.lastLogin===today)return;
  var yest=new Date(Date.now()-86400000).toDateString();
  if(pr.lastLogin===yest){ pr.streak++; }
  else { pr.streak=1; }
  pr.lastLogin=today;
  if(pr.streak>=3){ pr.coins+=pr.streak*3; toast('🔥 Streak '+pr.streak+'! +'+pr.streak*3+' 🪙','toast-g'); }
  if(pr.streak>=7) unlockAch('streak_7');
  saveAll();
}

function renderMap(){
  var pr=P();if(!pr)return;
  var html='';
  for(var w=0;w<WORLDS.length;w++){
    var wo=WORLDS[w];
    var ul=worldUnlocked(w);
    var done=wo.phases.filter(function(_,p2){return !!pr.phases[pk(w,p2)];}).length;
    var pct=Math.round(done/wo.phases.length*100);
    html+='<div class="world-card '+(ul?'':'locked')+'" style="background:linear-gradient(135deg,'+wo.dark+',var(--bg2));border-color:'+wo.color+'44">';
    html+='<div class="world-header"><div style="font-size:2.2rem">'+wo.emoji+'</div>'+
      '<div><div style="font-weight:900;color:'+wo.color+';font-size:.95rem">'+wo.name+'</div>'+
      '<div style="color:var(--t2);font-size:.76rem">'+wo.desc+'</div></div>'+
      (ul?'':'<div style="margin-left:auto;font-size:1.3rem">🔒</div>')+
    '</div>';
    if(ul){
      html+='<div style="margin-bottom:11px">'+
        '<div style="display:flex;justify-content:space-between;font-size:.76rem;color:var(--t2);margin-bottom:4px"><span>'+done+'/'+wo.phases.length+'</span><span>'+pct+'%</span></div>'+
        '<div class="pbar"><div class="pfill" style="width:'+pct+'%;background:'+wo.color+'"></div></div>'+
      '</div>';
      html+='<div class="phase-list">';
      for(var p=0;p<wo.phases.length;p++){
        var ph=wo.phases[p];
        var pUn=phaseUnlocked(w,p);
        var pD=pr.phases[pk(w,p)];
        var isG=pD&&pD.best===100;
        var stars='';
        if(pD){ for(var si=0;si<3;si++) stars+=(si<(pD.stars||0)?'⭐':'☆'); }
        var cls='phase-row'+(isG?' golden-row':pD?' done':ph.boss?' boss-row':'')+(!pUn?' locked-row':'');
        var onclick=pUn?'onclick="startPhase('+w+','+p+')"':'';
        html+='<div class="'+cls+'" '+onclick+'>'+
          '<div class="phase-num" style="background:'+wo.color+'22;color:'+wo.color+'">'+(p+1)+'</div>'+
          '<div class="phase-info">'+
            '<div class="phase-name">'+(ph.boss?'💀 ':ph.ombep?'🏆 ':'')+ph.name+'</div>'+
            '<div class="phase-topic">'+ph.topic+(ph.level?' • '+ph.level.charAt(0).toUpperCase()+ph.level.slice(1):'')+'</div>'+
          '</div>'+
          (pUn&&pD?'<div style="font-size:.85rem">'+stars+'</div>':pUn?'<div style="color:var(--t3);font-size:.85rem">▶</div>':'<div style="font-size:.9rem">🔒</div>')+
        '</div>';
      }
      html+='</div>';
    } else {
      html+='<div style="text-align:center;padding:13px;color:var(--t3);font-size:.85rem">🔒 Complete o mundo anterior para desbloquear</div>';
    }
    html+='</div>';
  }
  document.getElementById('mapBody').innerHTML=html;
}

function buyBox(t){
  var pr=P();if(!pr)return;
  var gemP={r:10,g:50};
  var coinP={c:50,u:200};
  if(gemP[t]){
    if(pr.gems<gemP[t]){toast('💎 Gemas insuficientes!','toast-r');return;}
    pr.gems-=gemP[t];
  } else {
    if(pr.coins<coinP[t]){toast('🪙 Moedas insuficientes!','toast-r');return;}
    pr.coins-=coinP[t];
  }
  pr.boxes[t]=(pr.boxes[t]||0)+1;
  saveAll(); renderShop(); toast('🎁 Caixa comprada!','toast-g');
}

function openBox(t){
  var pr=P();if(!pr)return;
  if(!pr.boxes[t]){return;}
  pr.boxes[t]--;
  var roll=Math.random()*100;
  var rarity='common';
  var odds=BOX_ODDS[t]||BOX_ODDS.c;
  for(var i=0;i<odds.length;i++){ if(roll<=odds[i].max){rarity=odds[i].r;break;} }
  var pool=PETS.filter(function(pp){return pp.rarity===rarity&&pr.pOwned.indexOf(pp.id)<0;});
  if(!pool.length) pool=PETS.filter(function(pp){return pp.rarity===rarity;});
  if(!pool.length) pool=PETS;
  var np=rnd(pool);
  if(pr.pOwned.indexOf(np.id)<0){
    pr.pOwned.push(np.id);
    pr.pLv[np.id]=1; pr.pAff[np.id]=0;
    saveAll(); renderShop();
    showModal(
      '<div style="font-size:.8rem;color:var(--gold);font-weight:700;margin-bottom:6px">NOVO PET!</div>'+
      '<div style="font-size:4rem;margin-bottom:8px;animation:bounce 1s ease-in-out infinite">'+np.e+'</div>'+
      '<h2 style="font-size:1.4rem;font-weight:900;margin-bottom:4px">'+np.name+'</h2>'+
      '<span class="badge '+badgeClass(np.rarity)+'" style="margin-bottom:10px">'+np.rl+'</span>'+
      '<p style="color:var(--t2);font-size:.85rem;margin:10px 0">'+np.desc+'</p>'+
      '<div style="background:var(--bg3);border-radius:8px;padding:8px 12px;font-size:.8rem;color:var(--gold);margin-bottom:16px">⚡ '+np.ab+'</div>'+
      '<button class="btn btn-p btn-full" onclick="closeModal()">Incrível! 🎉</button>'
    );
    spawnConfetti();
    if(pr.pOwned.length>=3) unlockAch('collector_3');
    if(pr.pOwned.length>=10) unlockAch('collector_10');
    if(pr.pOwned.length>=PETS.length) unlockAch('collector_all');
  } else {
    pr.coins+=80;
    saveAll(); renderShop();
    toast(np.e+' duplicado → +80 🪙','toast-p');
  }
}

function buyXPBonus(){
  var pr=P();if(!pr)return;
  if(pr.coins<50){toast('🪙 Moedas insuficientes!','toast-r');return;}
  pr.coins-=50; saveAll();

  var id=pr.id,name=pr.name;
  var np=defProfile(name);
  np.id=id;
  G.curProfile=np;
  var idx=G.profiles.findIndex(function(p){return p.id===id;});
  if(idx>=0)G.profiles[idx]=np;
  saveAll();
  goHome();
  toast('Perfil resetado.','toast-g');
}

var GS={};
var _timerID=null;

function startPhase(w,p){
  var key=pk(w,p);
  var ph=WORLDS[w].phases[p];
  var qs;
  // OMBEP phases use dedicated bank
  if(ph.ombep||ph.boss&&w===4){
    var lvl=ph.level||'ouro';
    if(ph.boss&&w===4) lvl='boss';
    qs=getOMBEPQuestions(lvl,10);
  } else {
    qs=Q[key];
  }
  if(!qs||!qs.length){toast('Questões em breve! 🔧','toast-r');return;}
  var cnt=(ph.ombep||ph.boss)?10:8;
  var sh=shuf(qs).slice(0,cnt);
  GS_powerups={hint:false,double:false,shield:false};
  GS={w:w,p:p,qs:sh,cur:0,ans:[],gameStreak:0,bossHP:100,startTime:Date.now(),combo:0};
  renderGameQ();
  showScreen('game');
}

function renderGameQ(){
  var wo=WORLDS[GS.w],ph=wo.phases[GS.p],q=GS.qs[GS.cur];
  var tot=GS.qs.length,pct=Math.round(GS.cur/tot*100);
  var curPet=getPet();

  var bossH='';
  if(ph.boss){
    bossH='<div class="boss-hd">'+
      '<div style="font-size:2.5rem;margin-bottom:3px;animation:shake .5s ease infinite alternate">💀</div>'+
      '<div style="font-weight:900;color:var(--red);margin-bottom:6px">BOSS: '+ph.name+'</div>'+
      '<div class="boss-hp"><div class="boss-hpf" id="bossHPF" style="width:'+GS.bossHP+'%"></div></div>'+
    '</div>';
  }

  var diffH='';
  for(var d=1;d<=5;d++){
    diffH+='<span style="display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:3px;background:'+(d<=ph.diff?wo.color:'var(--brd)')+'"></span>';
  }

  var letters=['A','B','C','D'];
  var optsH='';
  for(var i=0;i<q.o.length;i++){
    optsH+='<button class="opt" id="opt'+i+'" onclick="pickAns('+i+')">'+
      '<div class="opt-letter">'+letters[i]+'</div>'+
      '<span>'+esc(q.o[i])+'</span>'+
    '</button>';
  }

  var gameHTML=
  '<div class="game-tb">'+
    '<button class="game-quit" onclick="quitGame()">✕ Sair</button>'+
    '<div style="flex:1;margin:0 10px">'+
      '<div style="font-size:.75rem;color:var(--t2);margin-bottom:3px">'+wo.emoji+' '+ph.name+'</div>'+
      '<div style="height:6px;background:var(--bg3);border-radius:3px;overflow:hidden">'+
        '<div style="height:100%;width:'+pct+'%;background:'+wo.color+';border-radius:3px;transition:width .3s"></div>'+
      '</div>'+
    '</div>'+
    '<div style="font-size:.82rem;color:var(--t2);white-space:nowrap">'+(GS.cur+1)+'/'+tot+'</div>'+
    (GS.gameStreak>=3?'<div style="display:flex;align-items:center;gap:4px;font-size:.82rem;font-weight:700;padding:5px 9px;background:rgba(239,68,68,.15);border-radius:7px;border:1px solid rgba(239,68,68,.3)">🔥'+GS.gameStreak+'</div>':'')+
  '</div>'+
  '<div class="game-body" id="gameBody">'+
    bossH+
    // Powerup bar
    '<div style="display:flex;gap:7px;margin-bottom:-2px">'+
      '<button onclick="usePowerup(\'hint\')" style="flex:1;background:var(--bg2);border:1px solid var(--brd);border-radius:8px;padding:6px;font-size:.75rem;cursor:pointer;color:var(--t2)">💡 Dica 30🪙</button>'+
      '<button onclick="usePowerup(\'double\')" style="flex:1;background:var(--bg2);border:1px solid var(--brd);border-radius:8px;padding:6px;font-size:.75rem;cursor:pointer;color:var(--t2)">⚡ 2x XP 40🪙</button>'+
      '<button onclick="usePowerup(\'shield\')" style="flex:1;background:var(--bg2);border:1px solid var(--brd);border-radius:8px;padding:6px;font-size:.75rem;cursor:pointer;color:var(--t2)">🛡️ Escudo 60🪙</button>'+
      '<button onclick="usePowerup(\'skip\')" style="flex:1;background:var(--bg2);border:1px solid var(--brd);border-radius:8px;padding:6px;font-size:.75rem;cursor:pointer;color:var(--t2)">⏭️ Pular 50🪙</button>'+

    el.textContent='⏱ '+Math.round((Date.now()-GS.qStart)/1000)+'s';
  },1000);
}

function pickAns(idx){
  clearInterval(_timerID);
  var q=GS.qs[GS.cur];
  var correct=idx===q.a;
  var elapsed=(Date.now()-GS.qStart)/1000;
  GS.ans.push({c:correct,t:elapsed});

  // Disable all opts
  for(var i=0;i<q.o.length;i++){
    var el=document.getElementById('opt'+i);
    if(!el)continue;
    el.disabled=true;
    if(i===q.a) el.classList.add('oright');
    else if(i===idx&&!correct) el.classList.add('owrong');
  }

  var pr=P();
  if(correct){
    GS.gameStreak++;
    pr.totalC++;
    if(GS.gameStreak>=3) unlockAch('streak_3');
    if(elapsed<3) unlockAch('speed_demon');
    var pet_obj=getPet();
    var xm=getXPMultiplier();
    var sm=GS.gameStreak>=5?1.5:GS.gameStreak>=3?1.2:1;
    var xpG=Math.round(18*xm*sm);
    if(GS_powerups.double){xpG*=2;GS_powerups.double=false;}
    if(pr.pActive==='vortexis') xpG+=5;
    GS.combo=(GS.combo||0)+1;
    if(GS.combo>=2&&GS.combo<COMBO_MSGS.length&&COMBO_MSGS[GS.combo]){
      toast(COMBO_MSGS[GS.combo],'toast-g');
    }
    if(GS.combo>=5) unlockAch('combo_5');
    if(GS.combo>=10) unlockAch('combo_10');
    addXP(xpG);
    pr.coins+=6;
    pr.pAff[pr.pActive]=(pr.pAff[pr.pActive]||0)+1;
    floatXP('+'+xpG+' XP','#f59e0b');
    if(pr.totalC===1) unlockAch('first_correct');
    updDailyProgress('correct',1);
    // Boss HP
    if(WORLDS[GS.w].phases[GS.p].boss){
      GS.bossHP=Math.max(0,GS.bossHP-Math.round(100/GS.qs.length));
      var hf=document.getElementById('bossHPF');
      if(hf) hf.style.width=GS.bossHP+'%';
    }
    setBubble(rnd(pet_obj.ok));
    // Particles on button
    var btn_el=document.getElementById('opt'+idx);
    if(btn_el){var r=btn_el.getBoundingClientRect();spawnParticles(r.left+r.width/2,r.top,'#4ade80');}
  } else {
    GS.combo=0;
    if(GS_powerups.shield){
      GS_powerups.shield=false;
      toast('🛡️ Escudo absorveu o erro!','toast-p');
    } else {
      GS.gameStreak=0;
      pr.totalW++;
    }
    var pet_obj2=getPet();
    var xpErr=pr.pActive==='vortexis'?8:pr.pActive==='zeroix'?5:0;
    if(xpErr>0){addXP(xpErr);floatXP('+'+xpErr+' XP (erro!)','#8b5cf6');}
    setBubble(rnd(pet_obj2.no));
    var errBtn=document.getElementById('opt'+idx);
    if(errBtn){errBtn.classList.add('shake');}
  }

  // Show explanation
  var eb=document.getElementById('expBox');
  if(eb){
    eb.style.display='block';
    eb.innerHTML='<div class="exp-box"><div class="exp-title">💡 Explicação</div><div class="exp-text">'+esc(q.e||'Continue praticando!')+'</div></div>';
  }

  // Show next button
  var nb=document.getElementById('nextBtn');
  if(nb){
    nb.style.display='flex';
    var rem=GS.qs.length-GS.cur-1;
    nb.textContent=rem===0?'📊 Ver Resultado →':'Próxima ('+rem+') →';
  }
  saveAll();
}

function setBubble(msg){
  var el=document.getElementById('bubbleMsg');
  if(el) el.textContent='"'+msg+'"';
}

function nextQ(){
  GS.cur++;
  if(GS.cur>=GS.qs.length){ showResult(); }
  else { renderGameQ(); }
}

function quitGame(){
  if(confirm('Sair? O progresso desta fase será perdido.')){
    clearInterval(_timerID);
    goMap();
  }
}

function showResult(){
  clearInterval(_timerID);
  var pr=P();
  var wo=WORLDS[GS.w],ph=wo.phases[GS.p];
  var tot=GS.ans.length;
  var cor=GS.ans.filter(function(a){return a.c;}).length;
  var pct=Math.round(cor/tot*100);
  var passed=pct>=80;
  var stars=pct===100?3:pct>=90?2:pct>=80?1:0;
  var key=pk(GS.w,GS.p);
  var ex=pr.phases[key];
  if(passed){
    // Eulix bonus box on perfect
    if(pr.pActive==='eulix'&&pct===100){
      pr.boxes.u=(pr.boxes.u||0)+1;
      toast('📏 Eulix recompensa! +1 caixa Premium!','toast-g');
    }
    // Gaussix XP bonus
    if(pr.pActive==='gauss_pet'&&(GS.w===0||GS.w===4)){
      addXP(50); toast('🧮 Gaussix bônus: +50 XP!','toast-g');
    }
    updDailyProgress('phases',1);
    if(pct===100) updDailyProgress('perfect',1);
    pr.phases[key]={
      stars:ex?Math.max(ex.stars,stars):stars,
      best:ex?Math.max(ex.best,pct):pct,
      att:(ex?ex.att:0)+1,
    };
  }
  var noErrors=GS.ans.filter(function(a){return !a.c;}).length===0;
  if(noErrors&&passed) unlockAch('no_errors');
  var xpR=passed?Math.round(60+pct*.6+stars*25):12;
  var coR=passed?Math.round(30+stars*20):8;
  if(passed){
    addXP(xpR); pr.coins+=coR;
    if(pct===100){
      unlockAch('first_100');
      spawnConfetti();
      var goldC=Object.values(pr.phases).filter(function(p){return p&&p.best===100;}).length;
      if(goldC>=5)unlockAch('perfect_5');
      if(goldC>=20)unlockAch('perfect_20');
    }
  }
  // World completions
  var wDone=WORLDS[GS.w].phases.every(function(_,p2){return !!pr.phases[pk(GS.w,p2)];});
  if(wDone){
    var wAchs=['world_1','world_2','world_3','world_4','world_5'];
    if(wAchs[GS.w]) unlockAch(wAchs[GS.w]);
  }
  if(ph.ombep){
    if(ph.level==='bronze'&&passed)unlockAch('ombep_bronze');
    if(ph.level==='prata'&&passed)unlockAch('ombep_prata');
    if(ph.level==='ouro'&&pct>=80)unlockAch('ombep_ouro');
  }
  saveAll();

  var curPet=getPet();
  var isG=pct===100;
  var col=isG?'#f59e0b':passed?'#4ade80':'#ef4444';
  var emoji=isG?'🌟':passed?stars>=2?'🎉':'✅':'💪';
  var title=isG?'FASE DOURADA!':passed?'Fase Completa!':'Continue Tentando!';
  var pm=isG?curPet.p100[0]:passed?rnd(curPet.ok):rnd(curPet.no);
  var circ=2*Math.PI*52;
  var dash=circ*(1-pct/100);

  document.getElementById('resultTitle').textContent=wo.emoji+' '+ph.name;

  var starsH='';
  for(var si=0;si<3;si++) starsH+='<div class="star-item" id="sr'+si+'">'+(si<stars?'⭐':'☆')+'</div>';

  var rwH='';
  if(passed){
    rwH='<div class="rewards-box">'+
      '<div class="rw-title">🎁 RECOMPENSAS</div>'+
      '<div class="rw-list">'+
        '<div class="rw-item"><div style="font-size:1.5rem">⭐</div><div style="font-weight:700;font-size:.9rem;color:var(--gold)">+'+xpR+'</div><div style="font-size:.7rem;color:var(--t3)">XP</div></div>'+
        '<div class="rw-item"><div style="font-size:1.5rem">🪙</div><div style="font-weight:700;font-size:.9rem;color:var(--gold)">+'+coR+'</div><div style="font-size:.7rem;color:var(--t3)">Moedas</div></div>'+
        (isG?'<div class="rw-item"><div style="font-size:1.5rem">🌟</div><div style="font-weight:700;font-size:.9rem;color:var(--gold)">DOURADA</div><div style="font-size:.7rem;color:var(--t3)">Fase</div></div>':'')+
      '</div>'+
    '</div>';
  }

  var actH='';
  if(!passed) actH+='<button class="btn btn-p btn-full btn-lg" onclick="retryPhase()">🔄 Tentar Novamente</button>';
  if(passed&&GS.p<WORLDS[GS.w].phases.length-1) actH+='<button class="btn btn-p btn-full btn-lg" onclick="nextPhase()">▶️ Próxima Fase →</button>';
  if(passed&&GS.p===WORLDS[GS.w].phases.length-1&&GS.w<WORLDS.length-1) actH+='<button class="btn btn-grn btn-full btn-lg" onclick="nextWorld()">🌍 Próximo Mundo →</button>';
  actH+='<button class="btn btn-s btn-full" onclick="goMap()">🗺️ Mapa</button>';
  actH+='<button class="btn btn-gh btn-full" onclick="goHome()">🏠 Início</button>';

  document.getElementById('resultBody').innerHTML=
  '<div style="text-align:center;width:100%">'+
    '<div style="font-size:4rem;margin-bottom:8px">'+emoji+'</div>'+
    '<div style="font-size:1.9rem;font-weight:900;color:'+col+';margin-bottom:5px">'+title+'</div>'+
    '<div style="color:var(--t2)">'+(isG?'Perfeição absoluta!':passed?pct+'% — Aprovado!':pct+'% — Precisa de 80%')+'</div>'+
  '</div>'+
  '<div class="ring-wrap">'+
    '<svg class="ring-svg" viewBox="0 0 120 120">'+
      '<circle class="ring-bg" cx="60" cy="60" r="52"/>'+
      '<circle class="ring-fill" id="ringFill" cx="60" cy="60" r="52" stroke="'+col+'" stroke-dasharray="'+circ+'" stroke-dashoffset="'+circ+'"/>'+
    '</svg>'+
    '<div class="ring-center">'+
      '<div class="ring-pct" style="color:'+col+'">'+pct+'%</div>'+
      '<div class="ring-lbl">'+cor+'/'+tot+' certas</div>'+
    '</div>'+
  '</div>'+
  '<div class="star-row">'+starsH+'</div>'+
  '<div class="res-stats">'+
    '<div class="res-box"><div class="res-val t-grn">'+cor+'</div><div class="res-lbl">✅ Acertos</div></div>'+
    '<div class="res-box"><div class="res-val t-red">'+(tot-cor)+'</div><div class="res-lbl">❌ Erros</div></div>'+
    '<div class="res-box"><div class="res-val t-gold">'+stars+'⭐</div><div class="res-lbl">Estrelas</div></div>'+
  '</div>'+
  '<div class="card-s" style="display:flex;align-items:center;gap:12px;width:100%">'+
    '<div style="font-size:2.8rem">'+curPet.e+'</div>'+
    '<div style="font-size:.88rem;font-style:italic;flex:1;line-height:1.5">"'+esc(pm)+'"</div>'+
  '</div>'+
  rwH+
  '<div class="result-actions">'+actH+'</div>'+
  '<div style="height:16px"></div>';

  showScreen('result');
  document.getElementById('result').scrollTop=0;

  // Animate ring
  setTimeout(function(){
    var rf=document.getElementById('ringFill');
    if(rf) rf.style.strokeDashoffset=dash;
  },200);

  // Animate stars
  for(var si2=0;si2<3;si2++){
    (function(i){
      setTimeout(function(){
        var el=document.getElementById('sr'+i);
        if(el&&i<stars) el.classList.add('lit');
      },500+i*200);
    })(si2);
  }

  if(isG){ setTimeout(spawnConfetti,300); setTimeout(spawnConfetti,700); }
  updTopbar();
}

function retryPhase(){ startPhase(GS.w,GS.p); }
function nextPhase(){ startPhase(GS.w,GS.p+1); }
function nextWorld(){ startPhase(GS.w+1,0); }

function esc(s){
  if(typeof s!=='string') s=String(s||'');
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function generateStars(){
  var bg=document.getElementById('starsBg');
  if(!bg)return;
  var html='';
  for(var i=0;i<60;i++){
    var sz=1+Math.random()*3;
    var op=0.2+Math.random()*0.6;
    var dur=2+Math.random()*4;
    html+='<div class="star-dot" style="width:'+sz+'px;height:'+sz+'px;top:'+Math.random()*100+'%;left:'+Math.random()*100+'%;opacity:'+op+';animation-duration:'+dur+'s;animation-delay:'+Math.random()*3+'s"></div>';
  }
  bg.innerHTML=html;
}

];

];

function getDailyChallenge() {
  var pr = P(); if(!pr) return null;
  var today = new Date().toDateString();
  if(!pr.dailyChallenge || pr.dailyChallenge.date !== today) {
    var ch = DAILY_CHALLENGES[Math.floor(Math.random()*DAILY_CHALLENGES.length)];
    pr.dailyChallenge = {date:today, id:ch.id, progress:0, done:false};
    saveAll();
  }
  return pr.dailyChallenge;
}

function updDailyProgress(type, amount) {
  var pr = P(); if(!pr) return;
  var dc = getDailyChallenge(); if(!dc||dc.done) return;
  var ch = DAILY_CHALLENGES.find(function(c){return c.id===dc.id;});
  if(!ch||ch.type!==type) return;
  dc.progress = (dc.progress||0) + (amount||1);
  if(dc.progress>=ch.target && !dc.done) {
    dc.done = true;
    pr.coins += ch.reward;
    if(ch.gem>0) pr.gems += ch.gem;
    saveAll();
    toast('🎯 Desafio Diário concluído! +'+ch.reward+'🪙'+(ch.gem?' +'+ch.gem+'💎':''),'toast-g');
    setTimeout(function(){
      showModal(
        '<div style="font-size:.8rem;color:var(--gold);font-weight:700;margin-bottom:6px">DESAFIO DIÁRIO!</div>'+
        '<div style="font-size:3rem;margin-bottom:8px">🎯</div>'+
        '<h2 style="font-size:1.2rem;font-weight:900;margin-bottom:6px">'+ch.desc+'</h2>'+
        '<p style="color:var(--t2);font-size:.9rem;margin-bottom:14px">Concluído com sucesso!</p>'+
        '<div style="color:var(--gold);font-weight:700;margin-bottom:18px">+'+ch.reward+'🪙'+(ch.gem?' +'+ch.gem+'💎':'')+'</div>'+
        '<button class="btn btn-p btn-full" onclick="closeModal()">Resgatar! 🎁</button>'
      );
    },500);
  }
  saveAll();
}

// XP MULTIPLIER SYSTEM
function getXPMultiplier() {
  var pr = P(); if(!pr) return 1;
  var mult = 1;
  // Streak bonus
  if(pr.streak>=7) mult*=1.5;
  else if(pr.streak>=3) mult*=1.25;
  // Pet bonus
  var pet_id = pr.pActive;
  if(pet_id==='axiomata') mult*=1.4;
  else if(pet_id==='infinithos') mult*=1.5;
  else if(pet_id==='ramanujan_pet') mult*=1.75;
  else if(pet_id==='gauss_pet') mult*=1.3;
  else if(pet_id==='kalkulon') mult*=1.25;
  return mult;
}

// POWER-UPS (spendable boosts)
var POWERUPS = [
  {id:'hint',name:'Dica',desc:'Elimina 1 opção errada',icon:'💡',cost:30},
  {id:'skip',name:'Pular',desc:'Pula questão sem penalidade',icon:'⏭️',cost:50},
  {id:'double',name:'XP Duplo',desc:'Próxima questão dá 2x XP',icon:'⚡',cost:40},
  {id:'shield',name:'Escudo',desc:'Próximo erro não conta',icon:'🛡️',cost:60},
];

var GS_powerups = {hint:false,double:false,shield:false};

function usePowerup(id) {
  var pr = P(); if(!pr) return;
  var pu = POWERUPS.find(function(p){return p.id===id;});
  if(!pu) return;
  if(pr.coins<pu.cost){toast('🪙 Moedas insuficientes!','toast-r');return;}
  pr.coins-=pu.cost;
  if(id==='hint') applyHint();
  else if(id==='skip') skipQuestion();
  else if(id==='double') {GS_powerups.double=true; toast('⚡ XP Duplo ativado!','toast-g');}
  else if(id==='shield') {GS_powerups.shield=true; toast('🛡️ Escudo ativado!','toast-g');}
  saveAll();
}

function applyHint() {
  if(!GS||!GS.qs) return;
  var q = GS.qs[GS.cur];
  // Disable one wrong option
  var wrong = [];
  for(var i=0;i<q.o.length;i++){if(i!==q.a) wrong.push(i);}
  if(!wrong.length) return;
  var toDisable = wrong[Math.floor(Math.random()*wrong.length)];
  var el = document.getElementById('opt'+toDisable);
  if(el){el.disabled=true;el.style.opacity='0.2';}
  toast('💡 Uma opção errada foi eliminada!','toast-g');
}

function skipQuestion() {
  if(!GS||!GS.qs) return;
  GS.ans.push({c:true,t:0,skipped:true});
  nextQ();
  toast('⏭️ Questão pulada!','toast-p');
}

function init(){
  loadAll();
  generateStars();

  // Splash button
  var sb=document.getElementById('splashBtn');
  if(sb) sb.addEventListener('click',function(){
    if(G.profiles.length===0){
      showScreen('profiles');
      renderProfiles();
    } else if(G.profiles.length===1){
      selectProfile(G.profiles[0].id);
    } else {
      showScreen('profiles');
      renderProfiles();
    }
  });

  // Modal close on overlay click
  var ov=document.getElementById('mainModal');
  if(ov) ov.addEventListener('click',function(e){if(e.target===ov)closeModal();});
}

if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',init);
} else { init(); }

})();
</script>
